repos:
  - repo: local
    hooks:
      - id: claude-md-coverage
        name: New source directory carries its CLAUDE.md
        entry: exophial-check-claude-md
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --unsafe
      - id: check-added-large-files
        args:
          - --maxkb=1000
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args:
          - --fix=lf
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        files: \.[jt]sx?$
        types:
          - file
        args:
          - --fix
          - --max-warnings=0
        additional_dependencies:
          - eslint@9.17.0
          - typescript@5.7.2
          - typescript-eslint@8.18.2
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
          - css
          - json
          - markdown
          - yaml
        exclude: package-lock\.json$
        additional_dependencies:
          - prettier@3.4.2
  - repo: local
    hooks:
      - id: check-subtree-edits
        name: Subtree-path edits carry a git-subtree-dir trailer
        entry: exophial-check-subtree-edits
        language: system
        stages:
          - commit-msg
  - repo: local
    hooks:
      - id: reroute-main-commit
        name: Refuse a direct commit on main; reroute it to a worker branch
        entry: exophial-reroute-main-commit
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-commit
  - repo: local
    hooks:
      - id: session-trailer
        name: Stamp every commit with the session that produced it
        entry: exophial-session-trailer
        language: system
        stages:
          - commit-msg
