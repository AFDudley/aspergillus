repos:
  - repo: local
    hooks:
      - id: claude-md-coverage
        name: New source directory carries its CLAUDE.md
        entry: exophial-check-claude-md
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --unsafe
      - id: check-added-large-files
        args:
          - --maxkb=1000
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args:
          - --fix=lf
  - repo: local
    hooks:
      - id: eslint
        name: eslint (typescript/configs/eslint.config.js)
        entry: bun node_modules/.bin/eslint --config typescript/configs/eslint.config.js --fix
        language: system
        files: ^typescript/.*\.[jt]sx?$
      - id: prettier
        name: prettier (typescript/configs/prettier.config.cjs)
        entry: bun node_modules/.bin/prettier --config typescript/configs/prettier.config.cjs --check
        language: system
        files: ^typescript/.*\.(js|jsx|ts|tsx|mjs|cjs|json)$
  - repo: local
    hooks:
      - id: check-subtree-edits
        name: Subtree-path edits carry a git-subtree-dir trailer
        entry: exophial-check-subtree-edits
        language: system
        stages:
          - commit-msg
  - repo: local
    hooks:
      - id: reroute-main-commit
        name: Refuse a direct commit on main; reroute it to a worker branch
        entry: exophial-reroute-main-commit
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-commit
  - repo: local
    hooks:
      - id: session-trailer
        name: Stamp every commit with the session that produced it
        entry: exophial-session-trailer
        language: system
        stages:
          - commit-msg
