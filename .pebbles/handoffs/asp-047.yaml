summary: >
  Made aspergillus/python standalone-installable + versioned so a repo OUTSIDE
  the mtm monorepo (exophial, mtm-115) can install it and pin a version. The
  package was consumable ONLY via the monorepo-relative editable path
  (backtest [tool.uv.sources] path=../aspergillus/python, editable=true), which
  resolves only inside mtm; it sat at placeholder version 0.1.0 with no tags.
  This is packaging/distribution ONLY — no rule behavior changed.


  WHAT CHANGED. (1) [project].version 0.1.0 -> 0.2.0 (off the placeholder;
  first real release). (2) aspergillus.__init__ now exposes __version__ read
  from the distribution metadata (importlib.metadata.version("aspergillus")),
  so a parity gate can compare the standalone pin against the vendored subtree
  version off a SINGLE source of truth (pyproject [project].version) with no
  second hand-maintained literal to drift. (3) docs/design.md § Distribution ›
  Python rewritten to document the versioned-pin recipe, the two-resolution-
  path design, and the release/tag policy.


  DISTRIBUTION CHANNEL CHOSEN: pinned git URL against a release tag with
  subdirectory=python, NOT a package index. Reasoning: the name is not
  published to PyPI and publishing needs credentials + name ownership (higher
  friction, not doable here); a git tag is zero-friction, fully reproducible,
  and — because `git subtree split` is deterministic — maps a monorepo release
  commit to a STABLE synthetic upstream commit the tag points at, so the pin
  is stable across round-trips. The pre-existing design.md already used
  `git+...#subdirectory=python` unversioned; this adds the `@vX.Y.Z` tag pin
  that makes it version-pinnable (the actual pebble gap).


  TWO RESOLUTION PATHS (same package, same version pin, different source):
  standalone consumers use
  `[tool.uv.sources] aspergillus = { git = "ssh://git@github.com/AFDudley/aspergillus.git", tag = "v0.2.0", subdirectory = "python" }`;
  in-monorepo consumers (backtest) keep
  `aspergillus = { path = "../aspergillus/python", editable = true }`.
  backtest was NOT modified — the pebble scopes it "backtest CAN pin ... its
  choice"; the capability is proven (external install pins 0.2.0), and leaving
  backtest's editable override intact keeps the monorepo path working with zero
  blast radius into a second subtree. exophial wiring is mtm-115, out of scope.


  ACCEPTANCE PROVEN in genuinely external, non-editable clean venvs OUTSIDE
  this checkout (literal commands + output in verify_transcript):
  (a) built wheel installed into /tmp/asp-standalone-check via `uv pip install`
  — version discoverable as 0.2.0, and `python -m fixit lint` with
  enable=["aspergillus.rules"] FIRES the rules (EtaReduce ASP403,
  NoRedundantLambda, GlobalMutableState ASP203) against a fixture, exit 1;
  (b) the actual distribution mechanism proven end-to-end: subtree-split of the
  release commit pushed to a local bare repo, tagged v0.2.0, installed into a
  fresh venv via `git+file:///...@v0.2.0#subdirectory=python` — same rules
  fire, __version__ and dist metadata both report 0.2.0. The git+file URL is
  mechanically identical to the real `git@github.com:AFDudley/aspergillus.git`
  upstream; only the URL differs.


  COORDINATOR ACTION AT MERGE (release tag on the PUBLIC remote): after merging
  pebble/asp-047 to main, round-trip `scripts/subtree-sync.sh push aspergillus`
  (never --squash), then `git tag v0.2.0 <upstream-commit> && git push
  aspergillus v0.2.0`. Deterministic split guarantees the tag lands on the same
  synthetic commit proven above. Only then can mtm-115 pin the real remote URL.
  This is the one step reserved to merge-time round-trip (worker pushes feature
  branch, not upstream main); the mechanism itself is fully verified here.

