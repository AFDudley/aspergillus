    ./.venv/bin/python -c 'import aspergillus, importlib.metadata as m; print(m.version("aspergillus"), aspergillus.__version__)'
      -> dist 0.2.0  __version__ 0.2.0
    ./.venv/bin/python -m fixit lint fixture.py
      fixture.py@1:0 GlobalMutableState: ASP203 ...
      fixture.py@1:14 EtaReduce: ASP403 ...
      fixture.py@1:14 NoRedundantLambda: ...
      -> exit 1 (rules fired from the git-tag+subdirectory install)
