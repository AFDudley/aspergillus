summary: >
  python/src/aspergillus/__init__.py called
  importlib.metadata.version("aspergillus") with no guard. Under the
  bare-python3 acceptance-oracle contract (no venv, package not installed),
  this raised PackageNotFoundError and crashed the import before any
  package code ran. The fix wraps the call in try/except
  PackageNotFoundError and falls back to a fixed placeholder version
  string; the false "never falls back" comment is removed. When the
  package IS installed, __version__ still comes from the real
  distribution metadata, so the single source of truth is unchanged.
  Added scripts/verify_bare_import_version.py, the acceptance probe named
  by contracts/specs/derived-asp-c01.spec.json, with three arg-dispatched
  modes (pythonpath, sys_path, installed) that each spawn a real python3
  subprocess and emit one stdout_json observation. Verified by observing
  the probe RED against the pre-fix __init__.py (import_ok=false,
  package_not_found_error=true, via a temporary git stash of the fix,
  restored afterward) and GREEN after the fix, for all three modes,
  matching every "then" clause in the linked spec. Also fixed
  python/uv.lock, which was stale at version 0.2.0 against pyproject.toml's
  0.3.0; a plain `uv run` in python/ resolved it as a side effect of
  running the "installed" probe mode.
