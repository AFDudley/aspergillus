summary: >
  check-duplicates' detector (python/src/aspergillus/duplicates.py) only
  ever hashed a function's ENTIRE normalized body (find_duplicate_groups),
  so a copied statement spine embedded inside two differently-shaped
  functions never matched — the whole-body hashes differ once any
  surrounding code differs, by construction. Added
  find_fragment_duplicates, which slides a window of normalized statements
  across each function's body and hashes the window, catching a shared
  inner helper plus a shared statement block even when the rest of the
  function differs. find_all_duplicate_groups combines this with the
  existing whole-body match (deduplicating a pair already found in full) and
  is now what __main__.py's check-duplicates subcommand calls. Every
  reported DuplicateGroup carries a new clone_type label
  ("type-2-whole"/"type-2-fragment") and a numeric similarity score
  (fraction of the larger member's statements the match covers). Boilerplate
  bodies (pass-only, one-line getters, single-statement dunders) are now
  excluded from BOTH whole-body and fragment matching via a new
  FunctionRecord.is_boilerplate flag, even when they match verbatim — this
  also fixes a latent false positive in the pre-existing whole-body path
  (two unrelated pass-only __init__ methods previously hashed equal and
  would have been reported). The _Normalizer class (identifier ->_ID,
  literal -> type marker) is untouched.

  Refactored find_fragment_duplicates into three functions
  (_bucket_windows_at_length, _groups_from_bucket, find_fragment_duplicates)
  after aspergillus's own ASP201 (function too long, 87 lines) and ASP302
  (Optional-as-sentinel return) flagged the first draft when run against
  itself; _groups_from_bucket returns a zero-or-one-element list instead of
  `X | None`, matching this codebase's established sentinel-free idiom
  (see anti_special_casing.py's _string_value). Ran
  `python -m aspergillus` against duplicates.py/__main__.py and against
  aspergillus's own src/ tree after the change: zero new violations, and
  check-duplicates found several genuine real fragment clones already
  living in the rule catalog (e.g. _chain_elif_ids duplicated between
  fsm_enum_dispatch_exhaustive.py and fsm_redundant_branches.py).

  Added the nine derived-asp-d88.2 acceptance-oracle entrypoints under
  python/tests/oracle_scripts/ (each an arg-dispatched, judgment-free
  script emitting one stdout_json observation) plus their fixtures under
  python/tests/fixtures/asp_*, including the drive/put regression fixture
  (approximating exophial3's original src/e_new_model/shell/drive.py:drive
  vs driver.py:put report) and three research-labeled fixtures (Roy &
  Cordy 2007 type-2 editing scenario, Bellon et al. 2007 reference clone,
  BigCloneBench/Svajlenko et al. 2014 T2). Verified each oracle script's
  entrypoint did not exist before this change (find_all_duplicate_groups
  is new), so their RED state at the recorded base sha is by construction,
  not simulated. Added python/tests/test_duplicates_fragments.py as the
  inner-loop pytest suite covering the same ground plus unit-level cases
  (min_statements floor, boilerplate flag on FunctionRecord, whole-vs-
  fragment non-double-reporting). All 9 oracle scripts and the full pytest
  suite pass against the final commit.
