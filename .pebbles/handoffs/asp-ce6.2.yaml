summary: >
  Wrote docs/rust-rules.md, naming a Rust disposition for all 27 aspergillus
  rules (Level 2 ASP201-206, Level 3 ASP301-304, catalog ASP401-417): a
  clippy lint, an ast-grep rule under rust/ast-grep-rules/, a gate-native
  check in the aspergillus-rust-gate crate, a Rust language feature, or a
  specific stated reason the rule does not apply to Rust. Added three new
  gate-native checks to rust/src/purity.rs (ASP202 assertion density, ASP205
  impure function, ASP206 functional core / imperative shell), each a pure
  function over an already-parsed ast-grep tree, mirroring
  python/src/aspergillus/rules/level2.py and io_blocklist.py. Added
  clippy::redundant_closure (ASP403) to the gate's forced clippy lints and a
  new ast-grep rule for ASP404. Every checked rule (ASP201, ASP202, ASP204,
  ASP205, ASP206, ASP301, ASP403, ASP404 — 8 total) has a committed
  rust/fixtures/<ASPnnn>/{violating,satisfying}/ Cargo crate pair. Wrote
  five verification scripts (scripts/asp_rust_rule_audit.py,
  asp_rust_rule_probe.py, asp_rust_finding_format.py, asp_rust_no_autofix.py,
  asp_python_ts_rules_intact.py) and ran the full acceptance spec
  (contracts/specs/derived-asp-ce6.2.spec.json) end to end against the real
  built gate binary: all 10 clauses (C1-C10) pass. Also ran cargo test (13
  unit tests pass, including 8 new purity.rs tests), cargo clippy -D
  warnings (clean), cargo fmt --check (clean after one fmt pass), the full
  Python pytest suite (0 failures) and the full TypeScript bun test suite
  (60 pass, 0 fail, after `bun install` to populate this worktree's
  previously-empty node_modules), and pre-commit on every changed file
  (all hooks pass). This branch forked from main before the sibling
  asp-ce6.1 branch (the Rust gate runner crate) merged into `integrated`,
  so it started by fast-forward-merging `integrated` to pick that crate up
  before adding this deliverable on top; no new commit was created by that
  merge.
