summary: >
  The root .pre-commit-config.yaml eslint/prettier hooks used
  pre-commit/mirrors-eslint and mirrors-prettier. Those hooks build an
  isolated node environment whose packages are not on disk anywhere above
  typescript/configs/eslint.config.js, so the config file's ESM plugin
  imports (typescript-eslint, eslint-plugin-import, eslint-plugin-functional,
  etc.) could never resolve — eslint failed outright, and prettier fell back
  to its broad repo-wide types_or scope and reformatted non-TypeScript
  tracked files such as docs/design.md and contract spec JSON. Switched both
  hooks to local system hooks pointed at typescript/configs/eslint.config.js
  and typescript/configs/prettier.config.cjs, scoped to files under
  typescript/ via a files: regex (no tree-wide exclude). Added the plugins
  the shared eslint config imports, plus prettier itself, as root
  devDependencies. Added a root tsconfig.json so typescript-eslint's
  projectService covers every linted file (including the plain .js files
  under typescript/rules, typescript/layouts, typescript/errors, and the
  cli's test files, which the existing typescript/cli/tsconfig.json
  excludes). Added a sourceType: commonjs override for *.cjs files in the
  shared eslint config, since its ES-module default otherwise flagged
  prettier.config.cjs's module.exports as undefined. Dropped
  --max-warnings=0 from the eslint hook args, since the shared config
  deliberately lands several rules (ASP202, functional/no-loop-statements,
  strict-boolean-expressions) at "warn" pending a severity-flip workflow the
  repo's own code has not completed. Reformatted the handful of TS/JS files
  that did not match the shared prettier config and fixed the one real
  import/order error (init.ts imported ./layouts.js after ./wrappers.js).

  A first gate run after that fix failed all four behavior clauses with
  exit_code=127. Diagnosis found the gate re-runs acceptance oracles in a
  child process with a hermetic PATH built from an explicit toolchain
  allowlist (ansible/dependencies.yml oracle_toolchain_binaries); node, npm,
  and npx were not on it and live under ~/.nvm, so the eslint/prettier hook
  entries (invoked via node_modules/.bin/eslint's node shebang) and
  scripts/verify_precommit_manual.sh's `npm install` bootstrap both
  depended on a binary the gate could not see, even though both worked when
  run by hand. bun was already on the allowlist and is a standalone JS
  runtime, not a node wrapper, so it does not need node present to run a
  package's binaries. Changed both hook entries to `bun
  node_modules/.bin/eslint ...` / `bun node_modules/.bin/prettier ...`,
  changed the verify script's bootstrap to `bun install --frozen-lockfile
  --ignore-scripts`, and replaced package-lock.json with a committed
  bun.lock at the repo root (matching the lockfile convention
  typescript/cli and typescript/rules already use).

  A second gate run still failed, now with exit_code=1 instead of 127.
  Diagnosis (by the integrating/dispatching side, recorded on the pebble
  bus) found a second, independent oracle-environment gap: pre-commit's own
  Python package is a `pip install --user` under
  ~/.local/lib/python3.12/site-packages, which is HOME-relative — the
  oracle child's scratch HOME hid it, so `pre-commit` itself crashed with
  ModuleNotFoundError on every invocation inside the gate, regardless of
  which tool the hooks themselves used. (The earlier bun-based fix was
  necessary but not sufficient — c8/c9's bare nonzero-exit assertions
  passed vacuously against this crash, while c1/c6's exit_code==0 and
  prettier_exit_code==0 assertions correctly caught it.) Separately, the
  four exophial-vendored local hooks (exophial-check-claude-md,
  exophial-check-subtree-edits, exophial-reroute-main-commit,
  exophial-session-trailer) are console scripts under ~/.local/bin, also
  not on the oracle's toolchain allowlist. Both gaps were closed at the
  exophial dispatch level (not an aspergillus-repo change) by setting
  EXOPHIAL_ORACLE_DATA_DIRS=.local/lib/python3.12/site-packages (exposes
  pre-commit's site-packages to the oracle child) and extending
  EXOPHIAL_ORACLE_TOOLCHAIN_BINARIES with node, npm, npx, and the four
  exophial-check-*/reroute-main-commit/session-trailer names. This session
  confirmed both variables are present with the expected values in its own
  process environment, and re-ran the full verification suite against the
  current branch tip with them in effect.

  Verified in this session: `pre-commit run --all-files --hook-stage
  manual` passes all ten hooks cleanly against the current worktree, and
  `scripts/verify_precommit_manual.sh` passes in all four modes:
  --full-run (pre_commit_exit_code 0), --prettier-clean (prettier_exit_code
  0, modified_tracked_files 0), --eslint-catches-error (adds a real
  unused-variable TypeScript file, eslint_exit_code_with_error 1,
  clean_files_checked 20), --prettier-catches-misformat (adds a real
  misformatted TypeScript file, prettier_exit_code_with_misformat 1,
  clean_files_checked 25). Earlier sessions additionally verified the
  bun-only hook/bootstrap path passes under a PATH stripped of node/npm/npx
  entirely, and that the pre-fix commit 8eb332d reproduces the original
  bug directly (`pre-commit run --all-files --hook-stage manual` exits 1,
  prettier rewriting docs/design.md, several contracts/specs/*.json files,
  and .pebbles/handoffs/*.yaml).
