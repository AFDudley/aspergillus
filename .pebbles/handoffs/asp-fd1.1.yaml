summary: >
  Ported scripts/check_asp_fsm_enum_dispatch.py into FsmEnumDispatchExhaustive,
  a reject-severity Fixit/LibCST LintRule (ASP411) under
  python/src/aspergillus/rules/catalog/fsm_enum_dispatch_exhaustive.py. It
  reimplements the standalone checker's pure predicates (enum-class
  detection, if/elif chain walking, the assert_never-guard check) directly
  over the LibCST tree, so an if/elif dispatch on a module-local Enum with no
  `else: assert_never(subject)` guard (and no rewrite to `match`) is now
  caught by the real `fixit lint` CLI instead of a standalone script no
  gate invokes. Re-exported in both catalog/__init__.py and the parent
  rules/__init__.py (the load-bearing seam fixit's flat-only
  `enable=["aspergillus.rules"]` discovery actually walks) following the
  existing ASP4xx one-rule-per-file convention. python/tests/
  test_fsm_enum_dispatch_exhaustive.py converts the four merged scenarios
  from tests/fixtures/asp_fsm_enum_dispatch.py (no_assert_never_else ->
  flagged; match_assert_never, if_elif_assert_never_else, if_elif_non_enum ->
  clean) into direct contract assertions, plus a fixit-discoverability test,
  plus the standard add_lint_rule_tests_to_module VALID/INVALID fixture
  idiom. README.md and docs/design.md (new "ASP4xx — Catalog moves" table)
  document the rule. scripts/check_asp_fsm_enum_dispatch.py and its fixture
  were left in place per the coordinator triage (b8547d7): script retirement
  is a separate step gated behind all four rule ports, not this one.


  VERIFIED end-to-end the same way asp-6b0 verified ASP410: two
  dependency-free (stdlib-only) oracle probes, scripts/
  verify_fsm_enum_dispatch_lint.py and scripts/
  verify_fsm_enum_dispatch_pytest.py, shell out to the REAL
  `uv run --directory python fixit lint` / `pytest tests -q` CLIs (never
  call the rule in-process) using the repo's own python/pyproject.toml
  `[tool.fixit] enable=["aspergillus.rules"]` config. The if/elif-no-guard
  fixture reports FsmEnumDispatchExhaustive and exits 1; the
  match+assert_never fixture is clean and exits 0; the full suite (191
  tests, +11 new) stays green; mypy and ruff are clean.
