summary: >
  Added a Rust whole-workspace duplicate-function check to aspergillus.
  The check ships as a new `aspergillus-rust-dup-check` binary in the
  existing `aspergillus-rust-gate` crate (rust/). Its functional core
  (rust/src/duplicates.rs) walks a Cargo workspace's *.rs files across
  every crate, parses each function_item with the pinned ast-grep-core /
  ast-grep-config / ast-grep-language 0.40.0 crates, and normalizes it the
  same way python/src/aspergillus/duplicates.py normalizes a Python
  function: every variable-position `identifier` leaf collapses to one
  placeholder, while literal values, called-function names, macro names,
  and field/method names (a distinct tree-sitter-rust node kind,
  field_identifier, so kept exact by construction) stay exact. Two
  functions whose normalized bodies match anywhere in the workspace are
  reported as `path:line: ASP501` per member; the check never rewrites a
  scanned file and exits non-zero when it reports a finding. I derived the
  exact node-kind rules (call_expression.function, macro_invocation.macro,
  scoped_identifier chains, field_expression's field vs value) empirically
  by building a small throwaway dump program against the repo's own
  vendored tree-sitter-rust 0.24.2 grammar rather than guessing. I merged
  the already-integrated asp-ce6.1 Rust gate crate into this branch first
  (fast-forward, no conflicts) since this check builds on it per the
  pebble's husband-note. I wrote all 8 named acceptance-oracle probe
  scripts under scripts/ (they did not exist before this branch) plus a
  shared scripts/lib_rust_dup_check.sh fixture helper, ran each one and
  observed it fail before the check existed (red), then implemented the
  check and reran each probe to green. Running the new check against its
  own crate caught a real duplicate I had introduced (the *.rs file walk
  copy-pasted verbatim between the two binaries); I fixed it by extracting
  rust/src/workspace.rs and re-verified the fix drove the finding to zero
  without breaking any test or probe. 12 rust unit tests pass, clippy is
  clean, cargo fmt is clean, all 7 asp-ce6.1 regression oracles still pass
  unchanged, and the existing Python check-duplicates CLI still reports a
  duplicate group on its own reference fixture. I did not touch the
  TypeScript rule files or .pre-commit-config.yaml.
