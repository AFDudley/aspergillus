summary: >
  This change adds type-1 (exact) clone detection to check-duplicates.
  The old detector only found type-2 clones: bodies equal after
  identifier and literal normalization. The new detector hashes
  ast.dump of each function body. The ast module strips comments and
  whitespace on parse. It keeps identifier names and literal values
  exact. This hash is the Roy and Cordy (2007) type-1 signature. A new
  predicate excludes boilerplate: trivial dunders, one-line getters,
  and pass-only bodies. Each type-1 group carries a clone_type label
  and a similarity score, in both the CLI text report and the CLI JSON
  output. The change is wired into the real check-duplicates CLI, not
  only into the internal duplicates.py functions. A new test file,
  python/tests/test_type1_clones.py, holds 13 tests. It names both
  required sources: Roy and Cordy (2007) and Bellon and colleagues
  (2007). I verified the change four ways. First, I ran the full
  project test suite: 293 passed, 1 skipped. Second, I ran mypy and
  ruff against the changed source files: both clean. Third, I ran
  pre-commit on the changed files: all hooks passed. Fourth, I wrote
  and ran four standalone oracle scripts under scripts/, one per
  acceptance clause. Each script drives the real detector through
  `uv run --directory python python3`, since the detector needs the
  installed libcst dependency. Each script's stdout_json output
  matched the spec's expected values exactly, for all four behavior
  clauses (c1, c2, c3, c7).
