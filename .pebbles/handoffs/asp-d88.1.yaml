summary: >
  This is a reconciliation pass, not new feature work. asp-d88.1 (type-1
  exact clone detection) had already passed its own acceptance gate at
  7b91f9540cd3fbe1ab62e682a6fbf425b363cab9, but automatic reconciliation
  with current main produced no landable candidate tree. Investigation
  showed the literal `main` and `integrated` branches are both ancestors
  of this branch already, so the real conflict was against the sibling
  epic branch `epic/asp-d88`, which had by then absorbed asp-d88.2
  (fragment-granular type-2 clone detection) — a sibling sub-pebble that
  independently edited the same two files, duplicates.py and
  __main__.py, adding its own FunctionRecord/DuplicateGroup fields and
  its own find_all_duplicate_groups top-level finder. I merged
  epic/asp-d88 and hand-resolved both conflicts by keeping every
  addition from both sides: FunctionRecord now carries type1_hash
  (asp-d88.1) alongside statements and is_boilerplate (asp-d88.2, reused
  as-is since both sides defined the same boilerplate criteria — pass-only
  bodies, one-line getters, dunder methods); find_type1_duplicate_groups
  and format_type1_report stay a separate pipeline from the type-2
  find_all_duplicate_groups/find_fragment_duplicates pipeline, sharing
  one boilerplate exclusion; __main__.py's check-duplicates subcommand
  now runs both pipelines in the same invocation and reports type-2 and
  type-1 groups together, in both text and JSON output. A follow-up
  commit fixed two ruff UP038 findings (tuple-form isinstance -> X | Y)
  that were already present, unchanged, in the base-accepted commit —
  confirmed by running the self-check against that commit's own
  __main__.py before touching it, so this was pre-existing lint debt
  surfaced by ruff's UP038 rule, not something the merge introduced.
  Verified: the full project test suite (306 passed, 1 skipped, same
  count as before the merge plus asp-d88.2's tests); ruff, ruff-format,
  and mypy clean on every touched Python file; and all 4 behavior
  acceptance oracles from asp-d88.1's own spec
  (contracts/specs/derived-asp-d88.1.spec.json, clauses c1/c2/c3/c7)
  re-run fresh against the final merge commit, each still matching its
  `then` predicates exactly — proving the reconciliation preserved
  asp-d88.1's originally-accepted behavior rather than silently losing
  it during conflict resolution. `python -m aspergillus` against
  __main__.py still reports the same pre-existing ASP202/205/206
  findings it reported at the base-accepted commit (unchanged baseline,
  confirmed by diff), and reports zero violations against duplicates.py.
