summary: >
  Built a standalone whole-project type-2 duplicate-function detector as a NEW
  aspergillus CLI subcommand: `aspergillus check-duplicates <path>...
  [--min-lines N] [--allowlist FILE] [--json]`. It is a whole-project CLI tool,
  NOT a fixit.LintRule — fixit's LintRule mechanism is single-file only (the
  same limit ASP408/409 document), and the motivating case (the SAME function
  body copy-pasted across MANY files) is a cross-file fact a per-file CST rule
  structurally cannot see. LibCST is used purely as the parser; the grouping is
  across the whole corpus.


  DESIGN. duplicates.py is the pure functional core: extract_function_records
  (parse a source string, collect every FunctionDef INCLUDING methods + nested
  fns via a MetadataWrapper visitor, normalize each and hash it),
  find_duplicate_groups (bucket records by hash across ALL files, keep buckets
  with >1 member whose largest span >= min_lines and whose hash is not
  allow-listed, largest-first), parse_allowlist, format_report. __main__.py is
  the imperative shell: argparse, filesystem walk (rglob *.py), reads, stdout.
  Normalization is standard type-2: a CSTTransformer collapses every identifier
  (Name) to one placeholder and every literal to a type-only marker (str -> a
  marker string; int/float/imaginary -> a per-type valid canonical zero, which
  must itself be a syntactically valid literal of that node kind — libcst
  validates on construction, the one non-obvious gotcha). Operators, call /
  attribute / statement STRUCTURE and control flow are preserved, so genuinely
  different logic keeps a distinct hash. The pre-existing bare
  `python -m aspergillus <file>` lint invocation is preserved unchanged (the
  subcommand is dispatched only when argv[0] == "check-duplicates"); all 12
  existing test_cli.py cases stay green.


  ALLOWLIST. Mirrors exophial's scripts/vulture_whitelist.py pattern — a config
  file of accepted false positives, each keyed by the group's normalized_hash
  with a "#" citing comment. check-duplicates prints the exact hash to
  allowlist for every reported group, so a reviewer copies it in with a reason.
  --allowlist FILE loads the accepted set and suppresses those groups.


  MIN-LINES DEFAULT. The pebble suggested "something like --min-lines 10,
  mirroring dead_code_check". The motivating _git helper spans exactly 9 lines,
  so a default of 10 would MISS the very case this tool exists for. Kept the
  --min-lines flag/convention but set the default to 5: duplicate detection has
  a smaller natural size floor than dead-code detection (a 9-line helper
  copy-pasted 22x is precisely the target). This is a deliberate, stated
  senior-engineer call, documented in the module docstring and design.md.


  SCOPE. Did NOT migrate exophial's dead_code_check.py (explicitly out of scope
  per the pebble). No product/gateway/mobile/arcade behavior touched — this is
  aspergillus dev-tooling only, hence TDD-Exempt: infrastructure.
