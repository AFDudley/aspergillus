summary: >
  Added ASP415 ReducerReachability, a generic AST (fixit/libcst) rule in
  python/src/aspergillus/rules/catalog/reducer_reachability.py built in the
  same generic-rule-plus-subclass-config shape as ASP410 InProcessE2E: it
  rejects a call reaching a configured reducer/daemon-start symbol
  (run_cli_dispatch; daemon.start/dispatcher.run dotted calls; the fluent
  Dispatcher(...).run() construct+drive shape; subprocess.run/Popen whose
  argv carries a configured marker) inside a configured watched path set,
  unless the call is exempt via a configured decorator
  (@requires_container_reducer) or a configured container-harness import.
  Every symbol set, path glob, and exemption marker is an overridable class
  attribute, not hardcoded. Registered the rule in rules/__init__.py and
  catalog/__init__.py (the seam fixit's aspergillus.rules walk depends on)
  and added python/tests/test_reducer_reachability.py (14 pytest cases plus
  the generated VALID/INVALID fixture tests, 22 total) covering each
  detection shape, both exemption mechanisms, path-gating, and full
  symbol-set reconfigurability via an inline subclass. Wrote the linked
  spec's acceptance oracle, scripts/reducer_reachability_harness.py: for
  each of the four modes it builds a scratch consumer configuration (a
  fixit "local rule" module plus a root=true .fixit.toml, so ONLY that
  config is read — the shipped aspergillus.rules default is excluded) and
  a fixture inside python/, runs the real `uv run --directory python fixit
  lint` CLI as a subprocess against it, and maps the real violation outcome
  to a conventional lint-gate exit code (0 clean, 1 fired). Verified by
  running all four spec scenarios directly via `python3
  scripts/reducer_reachability_harness.py <mode> <config>` (no venv,
  matching the spec's exact invocation) and confirming exit codes match:
  generic/alt-demo -> 1 (an entirely unrelated made-up folder/symbol still
  gets caught, proving the engine is config-driven not hardcoded),
  bare/exophial -> 1 (unguarded call rejected), guarded/exophial -> 0
  (decorator-exempted call passes), outside-scope/exophial -> 0 (file
  outside watched folders never flagged). Also ran the full python test
  suite, ruff check/format, and mypy strict over the changed files —  all
  green — and confirmed pre-commit passes on the changed files.
