rule:
  kind: loop_expression
id: ASP204
language: rust
severity: error
message: |
  A `loop { ... }` has no statically-determinable iteration bound. Prefer
  an iterator, a bounded `for` range, or a `while` over a checked
  condition. See docs/design.md, "Level 2 — Blocking", ASP204 (no
  unbounded loops).
