id: ASP203
language: rust
severity: error
message: |
  A `static mut` declares global mutable state. Give the value a single
  owner instead — a struct field, a `OnceLock`, or an argument passed
  through the call chain. See docs/design.md, "Level 2 — Blocking",
  ASP203 (no global mutable state).
rule:
  kind: static_item
  has:
    kind: mutable_specifier
