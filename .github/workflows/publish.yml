name: Publish

on:
  push:
    branches: [multilang-support]
    paths: [package.json]

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need HEAD^ to diff version

      - name: Detect version change
        id: ver
        run: |
          CURRENT=$(jq -r '.version' package.json)
          PREVIOUS=$(git show HEAD^:package.json 2>/dev/null | jq -r '.version // empty')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ -z "$PREVIOUS" ]; then
              echo "First-time publish at version $CURRENT"
            else
              echo "Version changed: $PREVIOUS -> $CURRENT"
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($CURRENT) - skipping publish"
          fi

      - name: Set up Node
        if: steps.ver.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@afdudley'

      - name: Install dependencies
        if: steps.ver.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build CLI
        if: steps.ver.outputs.changed == 'true'
        run: npm run prepare

      - name: Publish
        if: steps.ver.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.current }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag rc
          else
            npm publish
          fi
